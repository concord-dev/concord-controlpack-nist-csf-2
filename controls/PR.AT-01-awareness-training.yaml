apiVersion: concord.dev/v1
kind: Control
metadata:
  id: NIST-CSF-2-PR.AT-01
  name: awareness-training-completed
  title: Workforce receives security awareness training annually
  framework: nist-csf-2
  category: Protect
  severity: high
  tags: [nist-csf, protect, training]
  owners:
    - team: people-ops
spec:
  description: |
    NIST CSF 2.0 PR.AT-01 requires personnel to be trained for their
    cybersecurity roles. Concord reads the training-register attestation
    and verifies every active person has a completion in the last 12
    months.
  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/PR.AT-01-pass.json
      params:
        kind: training_register
  policy:
    engine: rego
    package: concord.nist_csf_2.pr_at_01
    file: ../policies/pr_at_01.rego
  mappings:
    nist_csf: ["PR.AT-01"]
    iso27001: ["A.6.3"]
    soc2: ["CC1.4"]
    hipaa: ["164.308(a)(5)(i)"]
  status: stable
  blocking: true

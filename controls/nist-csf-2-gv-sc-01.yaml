apiVersion: concord.dev/v1
kind: Control

metadata:
  id: NIST-CSF-2-GV.SC-01
  name: nist-csf-2-gv-sc-01
  title: Cybersecurity supply chain risk management program is established
  framework: nist-csf-2
  category: Govern
  severity: high
  tags:
    - nist-csf
    - govern
    - supply-chain
  owners:
    - team: vendor-management

spec:
  description: |
    NIST CSF 2.0 GV.SC-01 requires a cybersecurity supply chain risk
    management (C-SCRM) program to be established, and its objectives,
    stakeholders, and management processes to be agreed by organizational
    stakeholders. Concord reads a cosigned C-SCRM program attestation that
    records the program scope, the roles accountable for it, the
    governance forum overseeing it, and the date it was last reviewed.

  rationale: |
    GV.SC-01 is the anchor control for the entire GV.SC category; every
    other supply-chain finding assumes a C-SCRM program exists. Auditors
    check that the program has an agreed scope, named owners, and a
    governance cadence rather than being ad hoc. The attestation captures
    that structure and forces annual re-review.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/nist-csf-2-gv-sc-01-pass.json
      params:
        kind: scrm_program

  policy:
    engine: rego
    package: concord.nist_csf_2.gv_sc_01
    file: ../policies/nist-csf-2-gv-sc-01.rego

  remediation:
    runbook: docs/remediation/nist-csf-2-gv-sc-01.md
    auto_fix: false
    estimated_effort: 1w

  mappings:
    nist_csf:
      - "GV.SC-01"
    nist_800_53:
      - "SR-1"
      - "SR-2"
      - "PM-30"
    iso27001:
      - "A.5.19"
      - "A.5.21"
    soc2:
      - "CC9.2"

  status: stable
  blocking: true

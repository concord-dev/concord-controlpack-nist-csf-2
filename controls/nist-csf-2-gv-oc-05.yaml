apiVersion: concord.dev/v1
kind: Control

metadata:
  id: NIST-CSF-2-GV.OC-05
  name: dependencies-understood-communicated
  title: Outcomes, capabilities, and services the organization depends on are understood
  framework: nist-csf-2
  category: Govern
  severity: medium
  tags:
    - nist-csf
    - govern
    - resilience
  owners:
    - team: it-security

spec:
  description: |
    NIST CSF 2.0 GV.OC-05 requires that outcomes, capabilities, and
    services that the organization depends on are understood and
    communicated. Concord reads a cosigned cyber-dependencies
    attestation listing the external capabilities and services the
    organization relies on, together with the resilience requirements
    placed on each.

  rationale: |
    An organization's cybersecurity outcomes hinge on third-party and
    infrastructure dependencies it does not directly control. Documenting
    these dependencies and their resilience requirements is what lets
    business-continuity and supply-chain risk decisions be grounded in
    reality rather than assumption.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/nist-csf-2-gv-oc-05-pass.json
      params:
        kind: cyber_dependencies

  policy:
    engine: rego
    package: concord.nist_csf_2.gv_oc_05
    file: ../policies/nist-csf-2-gv-oc-05.rego

  remediation:
    runbook: docs/remediation/nist-csf-2-gv-oc-05.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    nist_csf:
      - "GV.OC-05"
    nist_800_53:
      - "CP-2"
      - "PM-11"
    iso27001:
      - "A.5.30"
    soc2:
      - "A1.2"

  status: stable
  blocking: true

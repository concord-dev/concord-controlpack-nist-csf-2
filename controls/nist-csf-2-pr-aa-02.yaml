apiVersion: concord.dev/v1
kind: Control

metadata:
  id: NIST-CSF-2-PR.AA-02
  name: nist-csf-2-pr-aa-02
  title: Identities are proofed and bound to credentials based on context
  framework: nist-csf-2
  category: Protect
  severity: high
  tags: [nist-csf, protect, identity, identity-proofing]
  owners:
    - team: it-security

spec:
  description: |
    NIST CSF 2.0 PR.AA-02 requires that identities are proofed and bound to
    credentials based on the context of interactions. Concord reads a signed
    identity-proofing attestation and verifies that it documents the proofing
    process, the identity/authenticator assurance levels it targets, the
    method used to bind a proofed identity to its credential, and a recent
    review date.
  rationale: |
    Weak or undocumented proofing lets an attacker enrol under someone else's
    identity, defeating every downstream authentication and authorization
    control. Requiring an attested, signed process with declared assurance
    levels (e.g. NIST SP 800-63 IAL/AAL) is the floor for trustworthy
    identities.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/nist-csf-2-pr-aa-02-pass.json
      params:
        kind: identity_proofing

  policy:
    engine: rego
    package: concord.nist_csf_2.pr_aa_02
    file: ../policies/nist-csf-2-pr-aa-02.rego

  remediation:
    runbook: docs/remediation/nist-csf-2-pr-aa-02.md
    auto_fix: false
    estimated_effort: 1d

  mappings:
    nist_csf: ["PR.AA-02"]
    nist_800_53: ["IA-2", "IA-5"]
    iso27001: ["A.5.16"]
    soc2: ["CC6.1"]

  status: stable
  blocking: true

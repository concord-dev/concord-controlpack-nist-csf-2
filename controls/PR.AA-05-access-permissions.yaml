apiVersion: concord.dev/v1
kind: Control
metadata:
  id: NIST-CSF-2-PR.AA-05
  name: access-permissions-least-privilege
  title: Access permissions are managed under least-privilege; admin count is bounded
  framework: nist-csf-2
  category: Protect
  severity: critical
  tags: [nist-csf, protect, privileged-access]
  owners:
    - team: it-security
spec:
  description: |
    NIST CSF 2.0 PR.AA-05 requires access permissions and authorizations
    to be managed under least-privilege. Concord verifies the count of
    IAM administrators is bounded, that none hold long-lived access
    keys, and that every admin is MFA-enrolled.
  rationale: |
    The most common PR.AA finding is unbounded administrator pools.
    Bounding + MFA + no-static-keys is the floor.
  evidence:
    - id: iam_admins
      source: aws
      type: iam_privileged_principals
      fixture: ../tests/fixtures/PR.AA-05-pass.json
      params:
        region: ${env.AWS_REGION}
  policy:
    engine: rego
    package: concord.nist_csf_2.pr_aa_05
    file: ../policies/pr_aa_05.rego
  mappings:
    nist_csf: ["PR.AA-05"]
    iso27001: ["A.8.2"]
    soc2: ["CC6.1", "CC6.3"]
    nist_800_53: ["AC-6"]
  status: stable
  blocking: true

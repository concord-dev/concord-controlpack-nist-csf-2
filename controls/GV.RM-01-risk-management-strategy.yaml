apiVersion: concord.dev/v1
kind: Control

metadata:
  id: NIST-CSF-2-GV.RM-01
  name: risk-management-strategy
  title: Risk management objectives are established and agreed by stakeholders
  framework: nist-csf-2
  category: Govern
  severity: high
  tags:
    - nist-csf-2
    - governance
    - risk-management
  owners:
    - team: legal

spec:
  description: |
    NIST CSF 2.0 GV.RM-01 requires the organization's risk-management
    objectives to be established and agreed upon by stakeholders. Concord
    verifies a signed risk-management-strategy attestation lists
    objectives, the stakeholders who agreed to them, and a review cadence.

  rationale: |
    GV.RM-01 is the upstream control feeding every other GV.RM finding in
    a CSF 2.0 audit. Without an agreed strategy, auditors cannot tell
    whether the org's risk register reflects an intentional posture.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/GV.RM-01-pass.json
      params:
        kind: risk_management_strategy

  policy:
    engine: rego
    package: concord.nist_csf_2.gv_rm_01
    file: ../policies/gv_rm_01.rego

  remediation:
    runbook: docs/remediation/nist-csf-2-GV.RM-01.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    nist_csf:
      - "GV.RM-01"
    iso27001:
      - "A.5.1"

  status: stable
  blocking: true

apiVersion: concord.dev/v1
kind: Control
metadata:
  id: NIST-CSF-2-GV.PO-01
  name: information-security-policy
  title: Information security policy is documented, approved, and current
  framework: nist-csf-2
  category: Govern
  severity: high
  tags: [nist-csf, govern, policy]
  owners:
    - team: it-security
spec:
  description: |
    NIST CSF 2.0 GV.PO-01 requires an organization-wide information
    security policy to be established, communicated, and enforced.
    Concord reads a cosigned policy attestation.
  rationale: |
    GV.PO-01 is the meta-control auditors use to evaluate every other
    PR/DE/RS control.
  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/GV.PO-01-pass.json
      params:
        kind: information_security_policy
  policy:
    engine: rego
    package: concord.nist_csf_2.gv_po_01
    file: ../policies/gv_po_01.rego
  remediation:
    runbook: docs/remediation/csf-GV.PO-01.md
    auto_fix: false
    estimated_effort: 1w
  mappings:
    nist_csf: ["GV.PO-01"]
    iso27001: ["A.5.1"]
  status: stable
  blocking: true

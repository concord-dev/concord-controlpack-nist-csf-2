apiVersion: concord.dev/v1
kind: Control

metadata:
  id: NIST-CSF-2-GV.OC-02
  name: stakeholders-understood-prioritized
  title: Internal and external stakeholders are understood and prioritized
  framework: nist-csf-2
  category: Govern
  severity: medium
  tags:
    - nist-csf
    - govern
    - organizational-context
  owners:
    - team: leadership

spec:
  description: |
    NIST CSF 2.0 GV.OC-02 requires that internal and external
    stakeholders are understood, and that their needs and expectations
    regarding cybersecurity risk management are understood and
    prioritized. Concord reads a cosigned organizational-context
    attestation that enumerates the internal and external stakeholders
    and records the basis on which they are prioritized.

  rationale: |
    Stakeholder identification anchors the rest of the Govern function:
    risk appetite, policy, and role assignments are only defensible when
    the organization can name who its decisions affect and answer to.
    Auditors treat an empty or stale stakeholder register as evidence
    that governance is being performed on paper only.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/nist-csf-2-gv-oc-02-pass.json
      params:
        kind: organizational_context

  policy:
    engine: rego
    package: concord.nist_csf_2.gv_oc_02
    file: ../policies/nist-csf-2-gv-oc-02.rego

  remediation:
    runbook: docs/remediation/nist-csf-2-gv-oc-02.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    nist_csf:
      - "GV.OC-02"
    nist_800_53:
      - "PM-11"
      - "RA-9"
    iso27001:
      - "4.2"
    soc2:
      - "CC3.1"

  status: stable
  blocking: true

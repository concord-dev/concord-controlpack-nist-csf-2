apiVersion: concord.dev/v1
kind: Control
metadata:
  id: NIST-CSF-2-DE.CM-06
  name: third-parties-monitored-certifications
  title: Tier-1 vendor certifications are not expiring without remediation
  framework: nist-csf-2
  category: Detect
  severity: high
  tags: [nist-csf, detect, vendor]
  owners:
    - team: vendor-management
spec:
  description: |
    NIST CSF 2.0 DE.CM-06 requires external service-provider activity
    and risk to be monitored. Concord verifies no tier-1 vendor has
    a certification within 30 days of expiry that hasn't been
    flagged for renewal.
  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/DE.CM-06-pass.json
      params:
        kind: vendor_register
  policy:
    engine: rego
    package: concord.nist_csf_2.de_cm_06
    file: ../policies/de_cm_06.rego
  mappings:
    nist_csf: ["DE.CM-06"]
    iso27001: ["A.5.19", "A.5.21"]
    soc2: ["CC9.2"]
  status: stable
  blocking: false

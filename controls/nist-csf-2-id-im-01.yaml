apiVersion: concord.dev/v1
kind: Control

metadata:
  id: NIST-CSF-2-ID.IM-01
  name: nist-csf-2-id-im-01
  title: Improvements to organizational cybersecurity are identified
  framework: nist-csf-2
  category: Identify
  severity: medium
  tags:
    - nist-csf-2
    - identify
    - improvement
    - continuous-improvement
  owners:
    - team: security

spec:
  description: |
    NIST CSF 2.0 ID.IM-01 requires improvements to be identified from
    evaluations such as tests, exercises, audits, and lessons learned.
    Concord verifies a signed improvement-process attestation that
    enumerates the sources feeding the improvement pipeline, states the
    cadence at which they are reviewed, names the mechanism used to track
    improvements to closure, and shows the process was reviewed within the
    last year.

  rationale: |
    A framework program only stays effective if findings from evaluations
    are captured and driven to closure. ID.IM-01 fails when there are no
    identified improvement sources or no tracking mechanism, meaning
    lessons from incidents, audits, and exercises evaporate and the same
    weaknesses recur.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/nist-csf-2-id-im-01-pass.json
      params:
        kind: improvement_process

  policy:
    engine: rego
    package: concord.nist_csf_2.id_im_01
    file: ../policies/nist-csf-2-id-im-01.rego

  remediation:
    runbook: docs/remediation/nist-csf-2-id-im-01.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    nist_csf:
      - "ID.IM-01"
    nist_800_53:
      - "CA-7"
      - "PM-4"
    soc2:
      - "CC4.2"

  status: stable
  blocking: true

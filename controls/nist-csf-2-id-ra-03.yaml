apiVersion: concord.dev/v1
kind: Control

metadata:
  id: NIST-CSF-2-ID.RA-03
  name: nist-csf-2-id-ra-03
  title: Internal and external threats are identified and recorded
  framework: nist-csf-2
  category: Identify
  severity: high
  tags:
    - nist-csf-2
    - identify
    - risk-assessment
    - threats
  owners:
    - team: security

spec:
  description: |
    NIST CSF 2.0 ID.RA-03 requires internal and external threats to the
    organization to be identified and recorded. Concord verifies a signed
    threat-identification attestation that enumerates both the internal and
    external threats considered, states the method used to record them, and
    shows the threat set was reviewed within the last year.

  rationale: |
    Risk cannot be determined (ID.RA-05) without an explicit threat model
    covering both insider and adversary scenarios. ID.RA-03 fails when
    either the internal or external threat list is empty or the threats are
    not recorded anywhere durable, because unrecorded threats are silently
    dropped from every subsequent risk calculation.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/nist-csf-2-id-ra-03-pass.json
      params:
        kind: threat_identification

  policy:
    engine: rego
    package: concord.nist_csf_2.id_ra_03
    file: ../policies/nist-csf-2-id-ra-03.rego

  remediation:
    runbook: docs/remediation/nist-csf-2-id-ra-03.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    nist_csf:
      - "ID.RA-03"
    nist_800_53:
      - "RA-3"
      - "PM-16"
    iso27001:
      - "A.5.7"

  status: stable
  blocking: true

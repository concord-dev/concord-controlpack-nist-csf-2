apiVersion: concord.dev/v1
kind: Control

metadata:
  id: NIST-CSF-2-GV.RM-03
  name: cyber-risk-integrated-into-erm
  title: Cybersecurity risk management is integrated into enterprise risk management
  framework: nist-csf-2
  category: Govern
  severity: high
  tags:
    - nist-csf
    - govern
    - risk-management
    - erm
  owners:
    - team: risk

spec:
  description: |
    NIST CSF 2.0 GV.RM-03 requires that cybersecurity risk management
    activities and outcomes are included in enterprise risk management
    (ERM) processes. Concord reads a cosigned erm-integration
    attestation describing how cyber risk feeds the ERM process, how it
    is reported, and the path by which material cyber risks are
    escalated.

  rationale: |
    Cyber risk treated in a silo is invisible to the executives and board
    who own enterprise risk. GV.RM-03 is the control auditors use to
    confirm cybersecurity risk is aggregated, reported, and escalated
    alongside financial, operational, and strategic risk rather than
    managed as a purely technical concern.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/nist-csf-2-gv-rm-03-pass.json
      params:
        kind: erm_integration

  policy:
    engine: rego
    package: concord.nist_csf_2.gv_rm_03
    file: ../policies/nist-csf-2-gv-rm-03.rego

  remediation:
    runbook: docs/remediation/nist-csf-2-gv-rm-03.md
    auto_fix: false
    estimated_effort: 3d

  mappings:
    nist_csf:
      - "GV.RM-03"
    nist_800_53:
      - "PM-9"
      - "PM-28"
    iso27001:
      - "6.1.1"
    soc2:
      - "CC3.1"
      - "CC5.1"

  status: stable
  blocking: true

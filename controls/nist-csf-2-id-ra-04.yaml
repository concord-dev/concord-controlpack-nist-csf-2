apiVersion: concord.dev/v1
kind: Control

metadata:
  id: NIST-CSF-2-ID.RA-04
  name: nist-csf-2-id-ra-04
  title: Potential impacts and likelihoods of threats are recorded
  framework: nist-csf-2
  category: Identify
  severity: high
  tags:
    - nist-csf-2
    - identify
    - risk-assessment
    - risk-analysis
  owners:
    - team: security

spec:
  description: |
    NIST CSF 2.0 ID.RA-04 requires the potential impacts and likelihoods of
    threats exploiting vulnerabilities to be identified and recorded.
    Concord verifies a signed risk-impact attestation that publishes the
    impact scale and likelihood scale in use, records a set of risks scored
    against those scales, and shows the analysis was reviewed within the
    last year.

  rationale: |
    Risk cannot be prioritized without consistent impact and likelihood
    scales applied to recorded risks. ID.RA-04 fails when the scales are
    undefined or no risks have been scored, because impact and likelihood
    then become ad hoc judgements that cannot be compared, ranked, or
    tracked over time.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/nist-csf-2-id-ra-04-pass.json
      params:
        kind: risk_impact_analysis

  policy:
    engine: rego
    package: concord.nist_csf_2.id_ra_04
    file: ../policies/nist-csf-2-id-ra-04.rego

  remediation:
    runbook: docs/remediation/nist-csf-2-id-ra-04.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    nist_csf:
      - "ID.RA-04"
    nist_800_53:
      - "RA-3"
      - "PM-16"
    soc2:
      - "CC3.2"

  status: stable
  blocking: true

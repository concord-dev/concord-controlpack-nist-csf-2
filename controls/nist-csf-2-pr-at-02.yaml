apiVersion: concord.dev/v1
kind: Control

metadata:
  id: NIST-CSF-2-PR.AT-02
  name: nist-csf-2-pr-at-02
  title: Individuals in specialized roles are provided awareness and training
  framework: nist-csf-2
  category: Protect
  severity: medium
  tags: [nist-csf, protect, training, awareness, specialized-roles]
  owners:
    - team: people-ops

spec:
  description: |
    NIST CSF 2.0 PR.AT-02 requires that individuals in specialized roles are
    provided with awareness and training so they possess the knowledge and
    skills to perform relevant tasks. Concord reads a signed attestation for
    the role-based training program and verifies that it enumerates the
    specialized roles covered (e.g. incident responders, secure-code
    reviewers, administrators), documents the curriculum, confirms completion
    is tracked, was delivered within the last 365 days, and records a recent
    review date.
  rationale: |
    General awareness training does not equip privileged and specialized
    personnel for their specific risks. Role-based training that is current
    (delivered at least annually) and whose completion is tracked is what
    auditors expect for PR.AT-02, and is a prerequisite for holding those
    roles accountable.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/nist-csf-2-pr-at-02-pass.json
      params:
        kind: specialized_training

  policy:
    engine: rego
    package: concord.nist_csf_2.pr_at_02
    file: ../policies/nist-csf-2-pr-at-02.rego

  remediation:
    runbook: docs/remediation/nist-csf-2-pr-at-02.md
    auto_fix: false
    estimated_effort: 1d

  mappings:
    nist_csf: ["PR.AT-02"]
    nist_800_53: ["AT-3"]
    iso27001: ["A.6.3"]
    soc2: ["CC1.4"]

  status: stable
  blocking: true

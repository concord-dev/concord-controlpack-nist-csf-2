apiVersion: concord.dev/v1
kind: Control

metadata:
  id: NIST-CSF-2-GV.PO-02
  name: cybersecurity-policy-lifecycle
  title: Cybersecurity policy is reviewed, updated, communicated, and enforced
  framework: nist-csf-2
  category: Govern
  severity: high
  tags:
    - nist-csf
    - govern
    - policy
  owners:
    - team: it-security

spec:
  description: |
    NIST CSF 2.0 GV.PO-02 requires that the policy for managing
    cybersecurity risks is reviewed, updated, communicated, and enforced
    to reflect changes in requirements, threats, technology, and
    organizational mission. Concord reads a cosigned
    cyber-policy-management attestation recording the review cycle, how
    policy changes are communicated, and the process for handling
    exceptions.

  rationale: |
    GV.PO-01 establishes that a policy exists; GV.PO-02 is the control
    auditors use to confirm the policy is a living document rather than a
    one-time artifact. A defined review cadence, communication path, and
    exception process are what keep the policy aligned with a changing
    threat and regulatory landscape.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/nist-csf-2-gv-po-02-pass.json
      params:
        kind: cyber_policy_management

  policy:
    engine: rego
    package: concord.nist_csf_2.gv_po_02
    file: ../policies/nist-csf-2-gv-po-02.rego

  remediation:
    runbook: docs/remediation/nist-csf-2-gv-po-02.md
    auto_fix: false
    estimated_effort: 3d

  mappings:
    nist_csf:
      - "GV.PO-02"
    nist_800_53:
      - "PM-1"
      - "PL-1"
    iso27001:
      - "A.5.1"
      - "5.2"
    soc2:
      - "CC2.2"

  status: stable
  blocking: true

apiVersion: concord.dev/v1
kind: Control

metadata:
  id: NIST-CSF-2-GV.OC-03
  name: legal-regulatory-requirements-understood
  title: Legal, regulatory, and contractual cybersecurity requirements are understood
  framework: nist-csf-2
  category: Govern
  severity: high
  tags:
    - nist-csf
    - govern
    - legal-regulatory
  owners:
    - team: legal

spec:
  description: |
    NIST CSF 2.0 GV.OC-03 requires that legal, regulatory, and
    contractual requirements regarding cybersecurity — including privacy
    and civil liberties obligations — are understood and managed.
    Concord reads a cosigned legal-regulatory-requirements attestation
    listing the applicable regulations, the contractual obligations, and
    the process used to track them as they change.

  rationale: |
    Unmanaged compliance obligations are one of the highest-impact
    governance gaps: a missed statutory or contractual requirement can
    convert a routine incident into regulatory enforcement or breach of
    contract. A signed, current register lets auditors confirm the
    organization knows which obligations bind it and how it stays
    current.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/nist-csf-2-gv-oc-03-pass.json
      params:
        kind: legal_regulatory_requirements

  policy:
    engine: rego
    package: concord.nist_csf_2.gv_oc_03
    file: ../policies/nist-csf-2-gv-oc-03.rego

  remediation:
    runbook: docs/remediation/nist-csf-2-gv-oc-03.md
    auto_fix: false
    estimated_effort: 3d

  mappings:
    nist_csf:
      - "GV.OC-03"
    nist_800_53:
      - "PM-11"
      - "PL-2"
    iso27001:
      - "A.5.31"
      - "A.5.34"
    soc2:
      - "CC2.3"

  status: stable
  blocking: true

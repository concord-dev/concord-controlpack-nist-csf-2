apiVersion: concord.dev/v1
kind: Control

metadata:
  id: NIST-CSF-2-ID.RA-02
  name: nist-csf-2-id-ra-02
  title: Cyber threat intelligence is received from information sharing forums
  framework: nist-csf-2
  category: Identify
  severity: medium
  tags:
    - nist-csf-2
    - identify
    - risk-assessment
    - threat-intelligence
  owners:
    - team: security

spec:
  description: |
    NIST CSF 2.0 ID.RA-02 requires cyber threat intelligence to be received
    from information sharing forums and sources. Concord verifies a signed
    threat-intel attestation that enumerates the intelligence sources
    subscribed to, describes how feeds are ingested and triaged, names the
    internal teams that consume the intelligence, and shows the source list
    was reviewed within the last year.

  rationale: |
    Risk assessment is only as current as the threat intelligence feeding
    it. ID.RA-02 fails when there are no named intelligence sources or no
    ingestion process, because the organization then relies on discovering
    threats after they have already caused an incident rather than from
    shared early warning.

  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/nist-csf-2-id-ra-02-pass.json
      params:
        kind: threat_intel_sources

  policy:
    engine: rego
    package: concord.nist_csf_2.id_ra_02
    file: ../policies/nist-csf-2-id-ra-02.rego

  remediation:
    runbook: docs/remediation/nist-csf-2-id-ra-02.md
    auto_fix: false
    estimated_effort: 2d

  mappings:
    nist_csf:
      - "ID.RA-02"
    nist_800_53:
      - "PM-16"
      - "RA-3"
    iso27001:
      - "A.5.7"

  status: stable
  blocking: true

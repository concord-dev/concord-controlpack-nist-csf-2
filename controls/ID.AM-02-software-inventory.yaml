apiVersion: concord.dev/v1
kind: Control
metadata:
  id: NIST-CSF-2-ID.AM-02
  name: software-inventory-tracked
  title: Software inventory (SBOM + dependencies) is maintained per service
  framework: nist-csf-2
  category: Identify
  severity: high
  tags: [nist-csf, identify, sbom]
  owners:
    - team: platform
spec:
  description: |
    NIST CSF 2.0 ID.AM-02 requires inventories of software platforms
    and applications. Concord reads the Snyk org-projects export and
    verifies every active project has an SBOM and has been scanned in
    the last 30 days.
  rationale: |
    Without an SBOM, vuln-management findings cannot be tied back to
    specific deployable artefacts.
  evidence:
    - id: software_inventory
      source: snyk
      type: org_projects
      fixture: ../tests/fixtures/ID.AM-02-pass.json
      params:
        org_id: ${env.SNYK_ORG_ID}
  policy:
    engine: rego
    package: concord.nist_csf_2.id_am_02
    file: ../policies/id_am_02.rego
  remediation:
    runbook: docs/remediation/csf-ID.AM-02.md
    auto_fix: false
    estimated_effort: 1d
  mappings:
    nist_csf: ["ID.AM-02"]
    iso27001: ["A.5.9"]
  status: stable
  blocking: true

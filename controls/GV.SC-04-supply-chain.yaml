apiVersion: concord.dev/v1
kind: Control
metadata:
  id: NIST-CSF-2-GV.SC-04
  name: cyber-supply-chain-risk
  title: Suppliers, including third-parties, are known and prioritized by criticality
  framework: nist-csf-2
  category: Govern
  severity: high
  tags: [nist-csf, govern, supply-chain]
  owners:
    - team: vendor-management
spec:
  description: |
    NIST CSF 2.0 GV.SC-04 requires suppliers to be known and prioritized
    by criticality. Concord reads the Concord vendor-register attestation
    and verifies every tier-1 supplier has a current certification.
  rationale: |
    Supply-chain visibility is one of the most-cited GV findings.
    Concord's vendor register makes the structured data available.
  evidence:
    - id: attestation
      source: attestation
      type: policy_attestation
      fixture: ../tests/fixtures/GV.SC-04-pass.json
      params:
        kind: vendor_register
  policy:
    engine: rego
    package: concord.nist_csf_2.gv_sc_04
    file: ../policies/gv_sc_04.rego
  remediation:
    runbook: docs/remediation/csf-GV.SC-04.md
    auto_fix: false
    estimated_effort: 1d
  mappings:
    nist_csf: ["GV.SC-04"]
    iso27001: ["A.5.19"]
    soc2: ["CC9.2"]
  status: stable
  blocking: true
